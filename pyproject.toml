[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullstack-rag-application"
version = "0.1.0"
description = "A production-grade, modular RAG pipeline for document ingestion, chunking, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]